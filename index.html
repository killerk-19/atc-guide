<!doctype html>
<html lang="he" dir="rtl" class="locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>מדריך פקח טיסה</title>
  <meta name="description" content="מדריך לא רשמי לפקחי טיסה חדשים ברש&quot;ת: אבני דרך, זכויות לפי שלב, תשלומים שנתיים, קרנות, משמרות, ואיך קוראים תלוש ודוח פיצול.">
  <meta name="theme-color" content="#1f4e79">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">✈ מדריך פקח/ית טיסה</a>
    <span class="chip" id="version-chip" title="גרסה"></span>
    <button type="button" class="ghost" id="logout" title="התנתקות ומחיקת הזיכרון במכשיר">יציאה</button>
  </header>

  <section id="lock" class="lock">
    <form id="lock-form" class="card" hidden autocomplete="on">
      <h1>מדריך פקח/ית טיסה</h1>
      <p class="muted">האתר מיועד לעמיתים. הזינו את שם המשתמש והסיסמה שקיבלתם.</p>
      <label>שם משתמש <input id="lock-user" name="username" autocomplete="username" autocapitalize="none" required></label>
      <label>סיסמה <input id="lock-pass" name="password" type="password" autocomplete="current-password" required></label>
      <label class="check"><input id="lock-remember" type="checkbox"> זכור אותי במכשיר הזה</label>
      <button type="submit" class="primary" id="lock-go">כניסה</button>
    </form>
    <p id="lock-msg" class="muted" role="status"></p>
  </section>

  <nav class="tabs" aria-label="ניווט">
    <a href="#/" data-route="home"><span aria-hidden="true">⌂</span>בית</a>
    <a href="#/milestones" data-route="milestones"><span aria-hidden="true">⏱</span>אבני דרך</a>
    <a href="#/benefits" data-route="benefits"><span aria-hidden="true">★</span>זכויות</a>
    <a href="#/payments" data-route="payments"><span aria-hidden="true">₪</span>תשלומים</a>
    <a href="#/guide" data-route="guide"><span aria-hidden="true">▤</span>תלוש</a>
    <a href="#/shifts" data-route="shifts"><span aria-hidden="true">☾</span>משמרות</a>
    <a href="#/checklist" data-route="checklist"><span aria-hidden="true">✓</span>צ'קליסט</a>
  </nav>

  <main id="view" tabindex="-1" aria-live="polite">
    <p class="loading">טוען…</p>
  </main>


  <footer class="footer" id="footer"></footer>

  <script src="js/lock.js"></script>
</body>
</html>
